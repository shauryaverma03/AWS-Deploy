<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node Starter</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #eef4ff;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(90%, 520px);
        padding: 3rem;
        text-align: center;
        background: white;
        border: 1px solid #d7e2f5;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgb(44 75 130 / 15%);
      }

      h1 {
        margin-top: 0;
        color: #2458c6;
      }

      button {
        padding: 0.75rem 1.25rem;
        color: white;
        background: #2458c6;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
      }

      button:hover {
        background: #17439e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Node.js!</h1>
      <p>Your HTML frontend is running and ready to deploy.</p>
      <button id="action-button" type="button">Test the frontend</button>
      <p id="message" aria-live="polite"></p>
    </main>

    <script>
      document.querySelector('#action-button').addEventListener('click', () => {
        document.querySelector('#message').textContent = 'It works!';
      });
    </script>
  </body>
</html>
